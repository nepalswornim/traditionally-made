<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditionally Made</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fff8f0;
      color: #333;
    }

    /* Hero Section */
    .hero {
      background: url('hero.img') center/cover no-repeat;
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    /* Featured Recipe */
    .featured {
      padding: 4rem 0;
    }

    .featured img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .featured h2 {
      font-weight: 600;
      margin-top: 1rem;
      color: #d35400;
    }

    .btn-primary {
      background-color: #e67e22;
      border: none;
    }

    .btn-primary:hover {
      background-color: #cf6f17;
    }

    footer {
      background-color: #f0e6dc;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div>
      <h1>Traditionally Made</h1>
      <p>Food as it was intended.</p>
    </div>
  </section>

  <!-- Featured Recipe -->
  <section class="featured container">
    <div class="row align-items-center">
      <div class="col-md-6">
        <img src="carbonara.img" alt="Guanciale Carbonara">
      </div>
      <div class="col-md-6">
        <h2>Guanciale Carbonara</h2>
        <p>Authentic Italian pasta with guanciale, pecorino, and egg — no cream, no shortcuts.</p>
        <a href="#" class="btn btn-primary">See Recipe</a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Traditionally Made | Bringing authenticity back to your kitchen</p>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
