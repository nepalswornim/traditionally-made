<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditionally Made</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fff8f0;
      color: #333;
    }

    /* HERO */
    .hero {
      background: url('images/hero.jpg') center/cover no-repeat;
      height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
    }

    .hero p {
      font-size: 1.25rem;
    }

    /* SECTION TITLE */
    .section-title {
      color: #d35400;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* FLOWING RECIPE RAIL */
    .recipe-rail {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 1rem 0 2rem;
      scroll-snap-type: x mandatory;
    }

    .recipe-rail::-webkit-scrollbar {
      height: 8px;
    }

    .recipe-rail::-webkit-scrollbar-thumb {
      background: #e0cfc0;
      border-radius: 10px;
    }

    .recipe-card {
      min-width: 300px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      scroll-snap-align: start;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .recipe-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.25);
    }

    .recipe-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .recipe-card-body {
      padding: 1.25rem;
    }

    .recipe-card h5 {
      color: #d35400;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #e67e22, #cf6f17);
    }

    footer {
      background-color: #f0e6dc;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div>
      <h1>Traditionally Made</h1>
      <p>Food as it was intended.</p>
    </div>
  </section>

  <!-- RECIPES FLOW -->
  <section class="container my-5">
    <h2 class="section-title">Recipes</h2>

    <div class="recipe-rail">

      <!-- Carbonara -->
      <div class="recipe-card">
        <img src="images/carbonara.jpg" alt="Guanciale Carbonara">
        <div class="recipe-card-body">
          <h5>Guanciale Carbonara</h5>
          <p>No cream. No shortcuts. Just Rome.</p>
          <a href="carbonara.html" class="btn btn-primary btn-sm">View Recipe</a>
        </div>
      </div>

      <!-- Aglio e Olio -->
      <div class="recipe-card">
        <img src="images/aglio.jpg" alt="Aglio e Olio">
        <div class="recipe-card-body">
          <h5>Aglio e Olio</h5>
          <p>Garlic, oil, chili. That’s it.</p>
          <a href="aglio.html" class="btn btn-primary btn-sm">View Recipe</a>
        </div>
      </div>

      <!-- Placeholder / Future -->
      <div class="recipe-card">
        <img src="images/fetu.jpg" alt="Coming Soon">
        <div class="recipe-card-body">
          <h5>Coming Soon</h5>
          <p>Authentic dishes from around the world.</p>
          <a href="#" class="btn btn-primary btn-sm disabled">Soon</a>
        </div>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Traditionally Made | Authentic food only</p>
  </footer>

</body>
</html>
